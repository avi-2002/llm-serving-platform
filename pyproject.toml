[project]
name = "low-latency-llm-serving"
version = "0.1.0"
description = "A learning-first platform for measuring and serving open-source LLMs"
readme = "README.md"
authors = [
    { name = "avi-2002", email = "92429854+avi-2002@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "psutil>=7,<8",
    "safetensors>=0.5,<1",
    "torch==2.10.0",
    "transformers>=4.57,<5",
]

[project.scripts]
local-llm = "low_latency_llm_serving.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]
